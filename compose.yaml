services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_app
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    volumes:
      - app_storage:/var/www/html/storage/app
    environment:
      APP_NAME: "${APP_NAME:-Blog Sederhana}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-blog_db}"
      DB_USERNAME: "${DB_USERNAME:-blog_user}"
      DB_PASSWORD: "${DB_PASSWORD:-blog_password}"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "${RUN_SEEDERS:-true}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  database:
    image: mysql:8.4
    container_name: blog_database
    restart: unless-stopped
    networks:
      - backend
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-blog_db}"
      MYSQL_USER: "${DB_USERNAME:-blog_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-blog_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  app_storage:
  mysql_data:
